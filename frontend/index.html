<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EvalGuard Report Viewer</title>
<style>
  :root {
    --bg: #1b1c1e;
    --surface: #232427;
    --border: #34363a;
    --text: #d8d8d6;
    --muted: #8b8d92;
    --accent: #d8d8d6;
    --good: #6bab8c;
    --good-bg: #223028;
    --bad: #c07a72;
    --bad-bg: #332524;
    --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 56px 24px 96px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  h1 { font-size: 26px; margin: 0 0 8px; font-weight: 600; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; max-width: 620px; }
  .sub code { background: var(--border); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }

  .panel {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    padding: 24px;
  }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--text); color: var(--surface); border: 1px solid var(--text);
    border-radius: 7px; padding: 8px 14px; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .btn:hover { opacity: 0.85; }
  .btn.secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
  .btn.secondary:hover { background: var(--bg); opacity: 1; }
  input[type=file] { display: none; }

  .dropzone {
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 22px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .dropzone.dragover { border-color: var(--text); background: var(--bg); }

  details.paste { margin-top: 14px; }
  details.paste summary { font-size: 13px; color: var(--muted); cursor: pointer; }
  textarea.paste-area {
    width: 100%; min-height: 90px; margin-top: 10px; resize: vertical;
    background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    color: var(--text); font-family: var(--mono); font-size: 12.5px; padding: 10px;
  }
  .error-box {
    margin-top: 14px; padding: 10px 14px; border-radius: 7px;
    background: var(--bad-bg); color: var(--bad); font-size: 13px; display: none;
  }
  .error-box.show { display: block; }

  #dashboard { display: none; margin-top: 36px; }
  #dashboard.show { display: block; }

  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  header.top h1 { margin: 0; }

  .verdict {
    padding: 18px 22px; border-radius: 10px; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .verdict.pass { border-color: #cfe6d8; background: var(--good-bg); }
  .verdict.fail { border-color: #f0d3cf; background: var(--bad-bg); }
  .verdict-left { display: flex; align-items: center; gap: 16px; }
  .verdict-score { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 76px; }
  .verdict.pass .verdict-score { color: var(--good); }
  .verdict.fail .verdict-score { color: var(--bad); }
  .verdict-title { font-size: 14px; font-weight: 600; }
  .verdict.pass .verdict-title { color: var(--good); }
  .verdict.fail .verdict-title { color: var(--bad); }
  .verdict-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .badge { padding: 4px 10px; border-radius: 5px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .badge.pass { background: var(--good); color: #fff; }
  .badge.fail { background: var(--bad); color: #fff; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 28px; }
  .stat { background: var(--surface); padding: 14px 16px; }
  .stat .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat .value { font-size: 21px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat .value.good { color: var(--good); }
  .stat .value.bad { color: var(--bad); }

  .toolbar { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; gap: 12px; flex-wrap: wrap; }
  .toolbar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0; font-weight: 600; }
  .filters { display: flex; gap: 6px; }
  .filter-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; font-weight: 500;
  }
  .filter-btn.active { color: var(--text); border-color: var(--text); }

  .case { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .case-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer; gap: 12px; }
  .case-head:hover { background: var(--bg); }
  .case-head-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .case-id { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .case-desc { font-size: 13.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .case-score { font-family: var(--mono); font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chev { color: var(--muted); font-size: 11px; transition: transform 0.15s ease; }
  .case.open .chev { transform: rotate(90deg); }
  .case-body { display: none; padding: 2px 16px 16px; border-top: 1px solid var(--border); }
  .case.open .case-body { display: block; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
  @media (max-width: 680px) { .grid-2 { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2, 1fr); } }
  .field-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 12px 0 6px; }
  .field-label:first-child { margin-top: 0; }
  pre.code-block {
    background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    padding: 10px 12px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap;
    word-break: break-word; margin: 0; color: var(--text); max-height: 240px; overflow: auto;
  }
  .evals { margin-top: 14px; }
  .eval-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .eval-row:last-child { border-bottom: none; }
  .eval-icon { font-weight: 700; width: 14px; text-align: center; flex-shrink: 0; }
  .eval-icon.pass { color: var(--good); }
  .eval-icon.fail { color: var(--bad); }
  .eval-name { font-family: var(--mono); font-weight: 600; color: var(--text); flex-shrink: 0; }
  .eval-detail { color: var(--muted); }
  footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">EvalGuard</div>
  <h1>Report Viewer</h1>
  <p class="sub">Load the <code>report.json</code> produced by <code>evalguard run</code>. Everything runs locally in your browser — nothing leaves your machine.</p>

  <div id="loader-panel" class="panel">
    <div class="actions">
      <button class="btn" id="load-sample-btn" type="button">Load reports/report.json</button>
      <button class="btn secondary" id="pick-btn" type="button">Choose file&hellip;</button>
      <input type="file" id="file-input" accept="application/json,.json">
    </div>
    <div class="dropzone" id="dropzone">or drag a <code>.json</code> file here</div>
    <details class="paste">
      <summary>Paste JSON instead</summary>
      <textarea class="paste-area" id="paste-area" placeholder="Paste the contents of report.json, then press Ctrl+Enter"></textarea>
    </details>
    <div class="error-box" id="error-box"></div>
  </div>

  <div id="dashboard">
    <header class="top">
      <div>
        <h1 id="report-name"></h1>
        <div class="meta" id="report-meta"></div>
      </div>
      <button class="btn secondary" id="load-another">Load another report</button>
    </header>

    <div class="verdict" id="verdict">
      <div class="verdict-left">
        <div class="verdict-score" id="verdict-score"></div>
        <div>
          <div class="verdict-title" id="verdict-title"></div>
          <div class="verdict-sub" id="verdict-sub"></div>
        </div>
      </div>
      <div class="badge" id="verdict-badge"></div>
    </div>

    <div class="stats">
      <div class="stat"><div class="label">Total Cases</div><div class="value" id="stat-total">-</div></div>
      <div class="stat"><div class="label">Passed</div><div class="value good" id="stat-passed">-</div></div>
      <div class="stat"><div class="label">Failed</div><div class="value bad" id="stat-failed">-</div></div>
      <div class="stat"><div class="label">Overall Score</div><div class="value" id="stat-score">-</div></div>
    </div>

    <div class="toolbar">
      <h2 id="cases-heading">Case Results</h2>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pass">Passed</button>
        <button class="filter-btn" data-filter="fail">Failed</button>
      </div>
    </div>

    <section id="cases-container"></section>
  </div>

  <footer>EvalGuard Report Viewer — client-side only.</footer>
</div>

<script>
(function () {
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');
  const pickBtn = document.getElementById('pick-btn');
  const loadSampleBtn = document.getElementById('load-sample-btn');
  const pasteArea = document.getElementById('paste-area');
  const errorBox = document.getElementById('error-box');
  const loaderPanel = document.getElementById('loader-panel');
  const dashboard = document.getElementById('dashboard');
  const loadAnotherBtn = document.getElementById('load-another');

  let currentReport = null;
  let currentFilter = 'all';

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.add('show');
  }

  function clearError() {
    errorBox.textContent = '';
    errorBox.classList.remove('show');
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function validateReport(data) {
    if (typeof data !== 'object' || data === null) {
      throw new Error('Report must be a JSON object.');
    }
    const requiredKeys = ['name', 'overall_score', 'overall_passed', 'total_cases', 'cases'];
    for (const key of requiredKeys) {
      if (!(key in data)) {
        throw new Error(`Report is missing required field "${key}". Is this a valid EvalGuard report.json?`);
      }
    }
    if (!Array.isArray(data.cases)) {
      throw new Error('Report field "cases" must be an array.');
    }
    return data;
  }

  function loadReport(jsonText) {
    let data;
    try {
      data = JSON.parse(jsonText);
    } catch (err) {
      showError('Could not parse JSON: ' + err.message);
      return;
    }
    try {
      validateReport(data);
    } catch (err) {
      showError(err.message);
      return;
    }
    clearError();
    currentReport = data;
    currentFilter = 'all';
    document.querySelectorAll('.filter-btn').forEach((btn) => btn.classList.toggle('active', btn.dataset.filter === 'all'));
    renderDashboard(data);
    loaderPanel.style.display = 'none';
    dashboard.classList.add('show');
  }

  function renderDashboard(data) {
    document.getElementById('report-name').textContent = data.name || 'EvalGuard Report';
    const provider = data.provider || {};
    const metaBits = [];
    if (provider.type) metaBits.push(`Provider: ${provider.type}${provider.model ? ' / ' + provider.model : ''}`);
    if (data.generated_at) metaBits.push(`Generated ${data.generated_at}`);
    if (typeof data.duration_seconds === 'number') metaBits.push(`Duration ${data.duration_seconds}s`);
    document.getElementById('report-meta').textContent = metaBits.join(' · ');

    const pct = Math.round((data.overall_score || 0) * 1000) / 10;
    const minPct = Math.round((data.min_score || 0) * 1000) / 10;
    const passed = !!data.overall_passed;

    const verdict = document.getElementById('verdict');
    verdict.classList.toggle('pass', passed);
    verdict.classList.toggle('fail', !passed);
    document.getElementById('verdict-score').textContent = pct + '%';
    document.getElementById('verdict-title').textContent = passed ? 'Gate passed' : 'Gate failed';
    document.getElementById('verdict-sub').textContent = `Threshold ${minPct}% · Overall score ${pct}%`;
    const badge = document.getElementById('verdict-badge');
    badge.textContent = passed ? 'Pass' : 'Fail';
    badge.className = 'badge ' + (passed ? 'pass' : 'fail');

    document.getElementById('stat-total').textContent = data.total_cases ?? data.cases.length;
    document.getElementById('stat-passed').textContent = data.passed_cases ?? data.cases.filter((c) => c.passed).length;
    document.getElementById('stat-failed').textContent = data.failed_cases ?? data.cases.filter((c) => !c.passed).length;
    document.getElementById('stat-score').textContent = pct + '%';

    renderCases(data.cases);
  }

  function renderCases(cases) {
    const container = document.getElementById('cases-container');
    const filtered = cases.filter((c) => {
      if (currentFilter === 'pass') return c.passed;
      if (currentFilter === 'fail') return !c.passed;
      return true;
    });

    document.getElementById('cases-heading').textContent = `Case Results (${filtered.length}/${cases.length})`;

    if (filtered.length === 0) {
      container.innerHTML = '<p style="color: var(--muted); font-size: 13px;">No cases match this filter.</p>';
      return;
    }

    container.innerHTML = filtered.map((c, idx) => {
      const scorePct = Math.round((c.score || 0) * 1000) / 10;
      const evaluations = Array.isArray(c.evaluations) ? c.evaluations : [];
      const evalHtml = evaluations.map((ev) => {
        const evPct = Math.round((ev.score || 0) * 1000) / 10;
        return `
          <div class="eval-row">
            <span class="eval-icon ${ev.passed ? 'pass' : 'fail'}">${ev.passed ? '✓' : '✗'}</span>
            <span class="eval-name">${escapeHtml(ev.evaluator || '')}</span>
            <span class="eval-detail">score ${evPct}% — ${escapeHtml(ev.detail || '')}</span>
          </div>`;
      }).join('');

      return `
        <div class="case" id="viewer-case-${idx}">
          <div class="case-head" data-toggle="viewer-case-${idx}">
            <div class="case-head-left">
              <span class="chev">&#9656;</span>
              <span class="case-id">${escapeHtml(c.id || '')}</span>
              <span class="case-desc">${escapeHtml(c.description || '')}</span>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <span class="case-score" style="color: ${c.passed ? 'var(--good)' : 'var(--bad)'};">${scorePct}%</span>
              <span class="badge ${c.passed ? 'pass' : 'fail'}">${c.passed ? 'Pass' : 'Fail'}</span>
            </div>
          </div>
          <div class="case-body">
            <div class="field-label">Rendered Prompt</div>
            <pre class="code-block">${escapeHtml(c.prompt || '')}</pre>
            <div class="grid-2">
              <div>
                <div class="field-label">Expected</div>
                <pre class="code-block">${escapeHtml(JSON.stringify(c.expected || {}, null, 2))}</pre>
              </div>
              <div>
                <div class="field-label">Actual Response</div>
                <pre class="code-block">${escapeHtml(c.actual || '')}</pre>
              </div>
            </div>
            <div class="evals">
              <div class="field-label">Evaluations</div>
              ${evalHtml || '<p style="color: var(--muted); font-size: 12.5px;">No evaluator detail available.</p>'}
            </div>
          </div>
        </div>`;
    }).join('');

    container.querySelectorAll('.case-head').forEach((headEl) => {
      headEl.addEventListener('click', () => {
        document.getElementById(headEl.dataset.toggle).classList.toggle('open');
      });
    });
  }

  document.querySelectorAll('.filter-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach((b) => b.classList.toggle('active', b === btn));
      if (currentReport) renderCases(currentReport.cases);
    });
  });

  pickBtn.addEventListener('click', () => fileInput.click());

  loadSampleBtn.addEventListener('click', () => {
    clearError();
    fetch('reports/report.json', { cache: 'no-store' })
      .then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.text();
      })
      .then(loadReport)
      .catch((err) => {
        showError(
          'Could not fetch reports/report.json (' + err.message + '). ' +
          'Run "evalguard run examples/config.yaml" first (or "docker compose run --rm evalguard"), ' +
          'or use "Choose file…" / drag-and-drop instead.'
        );
      });
  });

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => loadReport(reader.result);
    reader.onerror = () => showError('Could not read the selected file.');
    reader.readAsText(file);
  });

  ['dragenter', 'dragover'].forEach((evt) => {
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });
  });
  ['dragleave', 'drop'].forEach((evt) => {
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
    });
  });
  dropzone.addEventListener('drop', (e) => {
    const file = e.dataTransfer.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => loadReport(reader.result);
    reader.onerror = () => showError('Could not read the dropped file.');
    reader.readAsText(file);
  });

  pasteArea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.ctrlKey) {
      loadReport(pasteArea.value);
    }
  });

  loadAnotherBtn.addEventListener('click', () => {
    dashboard.classList.remove('show');
    loaderPanel.style.display = '';
    fileInput.value = '';
    pasteArea.value = '';
    clearError();
    currentReport = null;
  });
})();
</script>
</body>
</html>
