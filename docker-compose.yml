services:
  evalguard:
    build: .
    container_name: evalguard-cli
    profiles: ["tools"]
    volumes:
      - ./reports:/app/reports
      - ./examples:/app/examples
    command: ["run", "examples/config.yaml"]

  frontend:
    image: nginx:alpine
    container_name: evalguard-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./reports:/usr/share/nginx/html/reports:ro
