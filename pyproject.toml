[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalguard"
version = "0.1.0"
description = "Automated regression testing for LLM prompts and agents — pytest for prompts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EvalGuard Contributors" }]
keywords = ["llm", "testing", "evaluation", "prompt-engineering", "ci", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
evalguard = "evalguard.cli:app"

[tool.setuptools.packages.find]
include = ["evalguard*"]

[tool.setuptools.package-data]
evalguard = ["templates/*.html", "templates/*.jinja"]
