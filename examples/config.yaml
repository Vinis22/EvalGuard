name: support-ticket-triage

provider:
  type: mock
  model: mock-llm-v1

prompt:
  template_path: prompt.jinja

dataset_path: dataset.jsonl

evaluators:
  - type: contains
    weight: 1.0
    options:
      case_sensitive: false
  - type: keyword_overlap
    weight: 1.0
    options:
      min_overlap: 0.3

min_score: 0.45
report_dir: ../reports
